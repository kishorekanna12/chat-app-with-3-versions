apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-app-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-app
      version: v1
  template:
    metadata:
      labels:
        app: chat-app
        version: v1
    spec:
      containers:
      - name: chat-app
        image: YOUR_DOCKERHUB_USER/chat-app-24mis0381:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service-v1
spec:
  type: NodePort
  selector:
    app: chat-app
    version: v1
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30001
    